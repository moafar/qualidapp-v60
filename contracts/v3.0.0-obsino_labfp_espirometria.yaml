contract_version: 1.0.0
history:
- version: 1.0.0
  date: 2026-02-23
  author: Observatorio
  description: Contrato generado desde contract_model.yaml usando como referencia
    v3.0.0-obsino_labfp_espirometria.yaml y el dataset ejemplo_10_filas.xlsx.
dataset:
  id: obsino_labfp_espirometria_extractor
  title: LABFP Espirometría (extractor)
  description: Contrato de validación para el dataset extraído desde el sistema de
    espirometría (formato original del extractor).
  owner: Observatorio
  domain: labfp
  tags:
  - labfp
  - espirometria
  - extractor
  - staging
  source_file: ejemplo_10_filas.xlsx
schema_policy:
  mode: permissive
  on_extra_columns: warn
  on_missing_columns: fail
rule_catalog:
- id: required
  description: El campo no puede ser nulo o vacío.
- id: unique
  description: Todos los valores del campo deben ser únicos.
- id: range
  description: El valor debe estar en un rango numérico.
- id: date-range
  description: La fecha debe estar entre min y max.
- id: domain
  description: El valor debe pertenecer a una lista permitida.
- id: regex
  description: El valor debe cumplir una expresión regular.
columns:
- name: Visit Date
  expected_type: datetime
  description: Fecha de realización de la prueba.
  rules:
  - id: required
- name: ID
  expected_type: identifier
  description: Identificación del paciente.
  normalization:
  - trim
  rules:
  - id: required
  sensitivity: pii
- name: Last Name
  expected_type: text
  description: Apellidos del paciente.
  normalization:
  - trim
  - uppercase
  rules:
  - id: required
  sensitivity: pii
- name: Middle Name
  expected_type: text
  description: Segundo nombre del paciente (si aplica).
  normalization:
  - trim
  - uppercase
  rules: null
  sensitivity: pii
- name: First Name
  expected_type: text
  description: Nombres del paciente.
  normalization:
  - trim
  - uppercase
  rules:
  - id: required
  sensitivity: pii
- name: DOB
  expected_type: numeric
  description: Fecha de nacimiento en formato dd/mm/yyyy.
  rules:
  - id: range
    min: 0
    max: 60000
  sensitivity: pii
- name: Age
  expected_type: numeric
  description: Edad en años.
  rules:
  - id: required
  - id: range
    min: 0
    max: 110
- name: Sex
  expected_type: categorical
  description: Sexo del paciente.
  normalization:
  - trim
  rules:
  - id: required
  - id: domain
    values:
    - Male
    - Female
- name: Weight
  expected_type: numeric
  description: Peso (kg).
  rules:
  - id: range
    min: 2
    max: 300
- name: Height
  expected_type: numeric
  description: Talla (cm).
  rules:
  - id: range
    min: 30
    max: 220
- name: Race
  expected_type: categorical
  description: Etnia/raza reportada.
  normalization:
  - trim
  rules:
  - id: domain
    values:
    - Asian
    - Black
    - Caucasian
    - Hispanic
    - NE Asian
    - Other
  sensitivity: quasi_identifier
- name: BMI
  expected_type: numeric
  description: Índice de masa corporal (kg/m^2).
  rules:
  - id: range
    min: 5
    max: 80
- name: BSA
  expected_type: numeric
  description: Superficie corporal (m^2).
  rules:
  - id: range
    min: 0.3
    max: 3.5
- name: Diagnosis
  expected_type: text
  description: Diagnóstico o indicación clínica.
  normalization:
  - trim
  rules: null
- name: Dyspnea
  expected_type: categorical
  description: Disnea (registro clínico / escala según sistema).
  normalization:
  - trim
  rules: null
- name: Cough
  expected_type: categorical
  description: Tos (registro clínico según sistema).
  normalization:
  - trim
  rules: null
- name: Wheez
  expected_type: categorical
  description: Sibilancias (registro clínico según sistema).
  normalization:
  - trim
